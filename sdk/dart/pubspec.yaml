# The NetworkHub Dart SDK: the generated gRPC client the desktop UI (and any
# other Dart consumer) talks to the daemon through. The client sources under
# lib/src/generated are produced by tools/gen-proto.sh and verified fresh in CI
# (ADR-0013); this package just wraps them with their runtime dependencies and a
# single barrel export.
name: networkhub_sdk
description: Generated gRPC/protobuf client for the NetworkHub daemon.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  grpc: ^5.1.0
  protobuf: ^6.0.0

dev_dependencies:
  lints: ^5.0.0
