# Code generation for the non-Rust clients.
#
# Rust is generated at compile time by nh-proto's build.rs (the Rust consumers
# are in the same cargo workspace and rebuild automatically), so it is NOT here.
# Dart and TypeScript live outside the cargo build, so they are generated by
# `buf generate` and committed, with tools/verify-proto-codegen.sh asserting in
# CI that the committed output is up to date (ADR-0013). Forgetting to regenerate
# after a proto change is then a failing build, not a silent drift.
#
# Both plugins are found on PATH; tools/gen-proto.sh puts them there
# (protoc-gen-dart from the Dart pub cache, protoc-gen-es from the TS SDK's
# node_modules). Run generation through that script, not buf directly.
version: v2

plugins:
  # Dart — the desktop UI client (WP-M0.12).
  - local: protoc-gen-dart
    out: ../sdk/dart/lib/src/generated
    opt:
      - grpc

  # TypeScript — the SDK and web dashboard (P2.6 / P3.5).
  - local: protoc-gen-es
    out: ../sdk/typescript/src/generated
    opt:
      - target=ts
