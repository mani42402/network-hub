[package]
name = "pal-macos"
description = "macOS PAL backend: PF anchors, SystemConfiguration, utun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# This crate does NOT inherit workspace lints: it is a designated FFI
# boundary. `unsafe_code` is "deny" rather than "forbid" so that specific
# FFI modules may opt in with #[allow] plus a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[dependencies]

# macOS-only: off macOS the crate is an empty stub and pulls none of this, so the
# workspace still builds on Linux and Windows (mirrors pal-windows). The M0 probe
# uses only safe `nix` wrappers (getifaddrs, uname, euid) plus a plist read — no
# unsafe. Precise Wi-Fi/Ethernet typing needs SystemConfiguration, added in M0.9.
[target.'cfg(target_os = "macos")'.dependencies]
nh-pal = { path = ".." }
nix = { version = "0.29", features = ["net", "feature", "user"] }
