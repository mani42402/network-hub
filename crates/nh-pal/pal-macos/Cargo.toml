[package]
name = "pal-macos"
description = "macOS PAL backend: PF anchors, SystemConfiguration, utun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# This crate does NOT inherit workspace lints: it is a designated FFI
# boundary. `unsafe_code` is "deny" rather than "forbid" so that specific
# FFI modules may opt in with #[allow] plus a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[dependencies]

# macOS-only: off macOS the crate is an empty stub and pulls none of this, so the
# workspace still builds on Linux and Windows (mirrors pal-windows). The M0 probe
# uses only safe `nix` wrappers (getifaddrs, uname, euid) plus a plist read — no
# unsafe. Precise Wi-Fi/Ethernet typing needs SystemConfiguration, added in M0.9.
[target.'cfg(target_os = "macos")'.dependencies]
nh-pal = { path = ".." }
nh-types = { path = "../../nh-types" }
# The Keyring trait the Keychain backend implements (WP-M1.1). nh-secrets has no
# platform deps, so this boundary edge is acyclic.
nh-secrets = { path = "../../nh-secrets" }
async-trait = { workspace = true }
nix = { version = "0.29", features = ["net", "feature", "user"] }
# Safe bindings to Keychain Services (Security.framework). The Keychain backend
# needs no `unsafe` of its own — the FFI is sealed inside this crate.
security-framework = "3"
# The M0.9 InterfaceInfo backend: getifaddrs (addresses/MAC/flags), the
# NET_RT_IFLIST2 sysctl (64-bit counters), and a PF_ROUTE socket (change
# watcher). All via raw FFI, which is why this crate is a designated boundary.
libc = "0.2"
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tempfile = { workspace = true }
