[package]
name = "pal-windows"
description = "Windows PAL backend: WFP, WinRT tethering, IP Helper, and the Windows IPC transport + service integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# This crate does NOT inherit workspace lints: it is a designated FFI
# boundary. `unsafe_code` is "deny" rather than "forbid" so that specific
# FFI modules may opt in with #[allow] plus a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[dependencies]

# The Windows IPC transport (named pipe → tonic) and the SCM service wrapper.
# All Windows-only: off Windows the crate is a stub and pulls none of this.
# The WP-M0.8 capability probe returns nh-pal's `SystemFacts`; the M0.9
# InterfaceInfo backend returns its interface types.
nh-pal = { path = ".." }
nh-types = { path = "../../nh-types" }
# The Keyring trait the DPAPI backend implements (WP-M1.1). nh-secrets has no
# platform deps, so this is an acyclic leaf → boundary edge.
nh-secrets = { path = "../../nh-secrets" }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true }
http = "1"
tower = "0.5"
tracing = { workspace = true }
# windows-service handles SCM registration, start/stop dispatch, and recovery
# actions. windows-sys covers the low-level probes: the client-process-id query
# (the Windows analogue of SO_PEERCRED), OS version (RtlGetVersion), token
# elevation, and interface enumeration (GetAdaptersAddresses).
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
