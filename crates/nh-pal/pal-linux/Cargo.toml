[package]
name = "pal-linux"
description = "Linux PAL backend: netlink, nftables, tc, hostapd, NetworkManager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# This crate does NOT inherit workspace lints: it is a designated FFI
# boundary. `unsafe_code` is "deny" rather than "forbid" so that specific
# FFI modules may opt in with #[allow] plus a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[dependencies]

# Linux-only: off Linux the crate is an empty stub and pulls none of this, so the
# workspace still builds on macOS and Windows (mirrors pal-windows). Safe `nix`
# wrappers cover the probe — getifaddrs (net), uname (feature), euid (user) — and
# /sys reads cover interface typing, so the M0 Linux probe needs no unsafe.
[target.'cfg(target_os = "linux")'.dependencies]
nh-pal = { path = ".." }
nix = { version = "0.29", features = ["net", "feature", "user"] }
