[package]
name = "pal-linux"
description = "Linux PAL backend: netlink, nftables, tc, hostapd, NetworkManager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# This crate does NOT inherit workspace lints: it is a designated FFI
# boundary. `unsafe_code` is "deny" rather than "forbid" so that specific
# FFI modules may opt in with #[allow] plus a SAFETY comment per block.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[dependencies]

# Linux-only: off Linux the crate is an empty stub and pulls none of this, so the
# workspace still builds on macOS and Windows (mirrors pal-windows). Safe `nix`
# wrappers cover the probe — getifaddrs (net), uname (feature), euid (user) — and
# /sys reads cover interface typing, so the M0 Linux probe needs no unsafe.
[target.'cfg(target_os = "linux")'.dependencies]
nh-pal = { path = ".." }
nh-types = { path = "../../nh-types" }
# The Keyring trait the Secret Service backend implements (WP-M1.1). nh-secrets
# has no platform deps, so this boundary edge is acyclic.
nh-secrets = { path = "../../nh-secrets" }
async-trait = { workspace = true }
# net: getifaddrs (probe); socket: the RTNETLINK change-watch socket. feature:
# uname. user: euid.
nix = { version = "0.29", features = ["net", "socket", "feature", "user"] }
# getifaddrs address extraction for the M0.9 InterfaceInfo backend; /sys and
# /proc cover kind, MAC, link state, and counters.
libc = "0.2"
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
secret-service = { version = "5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
