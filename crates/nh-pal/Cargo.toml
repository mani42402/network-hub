[package]
name = "nh-pal"
description = "Platform Adapter Layer trait definitions plus the mock backend used by tests (AD-7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# The mock backend. Off by default so production builds never link it; enabled
# by test builds and by daemon-sim (WP-M0.11) via `features = ["mock"]`. It adds
# tokio's timer for injectable latency; the async runtime itself is provided by
# the caller (a test's #[tokio::test], or the daemon).
mock = ["tokio/time"]

[dependencies]
# Internal crates are path dependencies (never workspace deps), which is also how
# `cargo xtask check-layers` identifies the internal dependency graph.
nh-types = { path = "../nh-types" }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# The shared interface-watch engine logs wake-source and enumeration failures.
tracing = { workspace = true }
# Interface change events use a broadcast channel (sync); the shared watch engine
# adds a backstop timer (time) and select! (macros). Spawning the engine is the
# backend's job, so `rt` is intentionally not pulled in here.
tokio = { workspace = true, features = ["sync", "time", "macros"] }

[dev-dependencies]
# Tests drive async guards and the mock.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
