[workspace]
resolver = "3"

# Members are listed explicitly rather than globbed. The dependency rules in
# ARCHITECTURE.md §5.1 are enforced mechanically by `cargo xtask check-layers`,
# and an explicit list makes an accidental new crate a visible diff.
members = [
    # Foundation — no internal dependencies.
    "crates/nh-types",
    "crates/nh-proto",

    # Engine.
    "crates/nh-state",
    "crates/nh-secrets",

    # Platform Adapter Layer: traits + mock, then one backend per OS.
    # Feature crates depend on `nh-pal` only; never on a concrete backend.
    "crates/nh-pal",
    "crates/nh-pal/pal-linux",
    "crates/nh-pal/pal-windows",
    "crates/nh-pal/pal-macos",

    # Feature modules.
    "crates/nh-firewall",
    "crates/nh-vpn",
    "crates/nh-hotspot",
    "crates/nh-dhcp",
    "crates/nh-dns",
    "crates/nh-monitor",
    "crates/nh-devices",
    "crates/nh-automation",
    "crates/nh-analytics",
    "crates/nh-plugin-host",
    "crates/nh-updater",

    # Binaries — the only crates permitted to produce executables.
    "crates/nh-daemon",
    "crates/nh-gateway",
    "crates/nh-cli",

    # Repo tooling (exempt from the product layer rules).
    "tools/xtask",
    "tools/state-diff",
]

# Phase 0 spikes are deliberately throwaway: they answer a question and are then
# deleted or promoted. Keeping them out of the workspace means they cannot
# accumulate dependencies, trip the layer rules, or slow the main build.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
# TODO(WP-0.1): set to the real remote once the GitHub repo exists.
repository = "https://github.com/REPLACE-ME/networkhub"
authors = ["NetworkHub contributors"]

# ---------------------------------------------------------------------------
# Shared dependency versions. Crates opt in with `dep.workspace = true` so the
# whole workspace moves together — a single version bump, reviewed once.
# ---------------------------------------------------------------------------
[workspace.dependencies]
anyhow = "1"
# CLI argument parsing for the daemon and cli binaries.
clap = { version = "4", features = ["derive"] }
# Async methods in the PAL traits. Native async-fn-in-traits is not
# dyn-compatible and does not guarantee Send futures for tokio::spawn; the daemon
# needs both, and PAL calls are not a hot path, so the boxing is a non-issue.
async-trait = "0.1"
# gRPC stack. Versions pinned from the SPIKE-A resolution (WP-0.3); note that
# tonic 0.14 split prost codegen into tonic-prost / tonic-prost-build, so both
# are needed alongside tonic itself (a lesson recorded in ADR-0016).
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
# Reads custom method options (required_permission) from the compiled descriptor
# at runtime — prost itself drops unknown fields, so a reflection layer is needed
# for the authz interceptor and the permission-coverage test (§10.3).
prost-reflect = { version = "0.16", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
# Small, dependency-free RNG for backoff jitter. Not used for anything
# security-sensitive (that is getrandom via the crypto crates); just to spread
# retry timing so reconcilers do not thunder together.
fastrand = "2"
# SQLite persistence (config.db, ADR-0010). The bundled feature vendors SQLite,
# so builds are hermetic on all three OSes — no system libsqlite3, same lesson
# as vendoring protoc. Runtime queries only (no compile-time DATABASE_URL).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
] }
# BLAKE3 for the audit log's tamper-evident hash chain (§10.4).
blake3 = "1"
# Regex: the belt-and-braces log redaction scrub (§15), behind the compile-time
# Secret<T> guarantee. Also the eventual home for network-facing parsers.
regex = "1"
# Secret memory hygiene: overwrites secret bytes on drop so VPN keys and
# passphrases do not linger in freed memory. Backs `Secret<T>` in nh-types.
zeroize = { version = "1", features = ["derive"] }
# Compile-fail tests: assert that misuse (e.g. printing a Secret) does not
# compile. A dev-dependency wherever it is used.
trybuild = "1"
# Temp files/dirs for tests that need a real on-disk SQLite database.
tempfile = "3"

# ---------------------------------------------------------------------------
# Lints. CI runs clippy with `-D warnings`, so every "warn" below is a hard
# error in the pipeline. See CONTRIBUTING.md for the sanctioned escape hatches.
#
# `unsafe_code = "forbid"` is deliberate and cannot be overridden per-crate.
# The three `pal-*` backends opt OUT of workspace lints entirely (they are the
# designated FFI boundary) and set `deny` instead — see their manifests.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A privileged daemon should not panic its way out of a bad day.
unwrap_used = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
mem_forget = "warn"

[profile.release]
# Debug symbols are kept: crash reports from the field are worthless without
# them, and we strip into separate symbol files at packaging time (WP-M3.2).
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev]
# The netns and fault-injection suites run debug builds; default opt-level 0
# makes them slow enough to change developer behaviour, which is worse.
opt-level = 1
