version: 2

# Dependency updates. For a privileged daemon the dependency tree is part of the
# attack surface, so updates arrive as reviewable pull requests on a schedule
# rather than as an annual scramble when an advisory lands.
#
# `cargo deny check advisories` runs nightly (nightly.yml) and catches CVEs
# between these updates.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      # Patch bumps are usually uninteresting individually and noisy in bulk.
      patch-updates:
        update-types: [patch]
      # Keep the async runtime and its ecosystem moving together; splitting
      # them across pull requests produces version conflicts that look like
      # bugs.
      tokio-stack:
        patterns: ["tokio", "tokio-*", "tower", "tower-*", "hyper", "hyper-*"]

  # Workflow actions are executable code in our build pipeline. They get the
  # same treatment as any other dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # Re-enable from WP-M0.12 (pub) and P2.6 (npm), when these manifests exist.
  # Dependabot ERRORS on a directory with no manifest, so they stay commented
  # out until then rather than reddening the dashboard every week.
