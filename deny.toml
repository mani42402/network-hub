# cargo-deny configuration.
#
# This file is a licence firewall as much as a lint. NetworkHub ships a
# privileged daemon under Apache-2.0 with a commercial enterprise tier planned
# (ARCHITECTURE.md §16), so a GPL dependency landing in the tree by accident is
# a genuine legal problem rather than a style issue. OpenVPN (GPLv2) is
# integrated as a *separate process* precisely so it never appears here (AD-8).

[graph]
# Evaluate the graph for every platform we ship, not just the host. Otherwise a
# Windows-only dependency with a bad licence stays invisible on a macOS laptop.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Unmaintained/unsound/vulnerable crates fail the build. Exceptions require an
# entry here with a rationale and an expiry — never a silent ignore.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Anything not on this list fails, which is the point:
# adding a licence is a deliberate, reviewed act.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # MPL-2.0 is file-level copyleft: linking is fine and it does not reach our
    # own sources. Permitted, but prefer a permissive alternative where one
    # exists — it complicates the enterprise licensing story (§16).
    "MPL-2.0",
]
confidence-threshold = 0.93

# Crates whose licence metadata is absent or unparseable must be listed here
# explicitly, with the licence verified by hand.
exceptions = []

[bans]
multiple-versions = "warn"
# Third-party wildcard versions are banned (they make builds unreproducible),
# but internal crates are path dependencies with no version, which cargo-deny
# counts as wildcards. Those are legitimate — the workspace pins everything —
# so path wildcards are allowed while external ones stay denied.
wildcards = "deny"
allow-wildcard-paths = true
# Dependencies we never want, with the reason recorded at the point of refusal.
deny = [
    # We are a TLS-terminating product; rustls is the chosen stack. Pulling in
    # OpenSSL would add a C dependency, a licence wrinkle, and a second CVE feed.
    { name = "openssl-sys", reason = "use rustls; see ARCHITECTURE.md §10.4" },
    { name = "openssl", reason = "use rustls; see ARCHITECTURE.md §10.4" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies are banned by default. A fork we must carry (e.g. a
# userspace WireGuard engine, OD-2) gets vendored or published, not pinned to a
# moving branch — a build that depends on someone else's git history is not
# reproducible and not auditable.
allow-git = []
